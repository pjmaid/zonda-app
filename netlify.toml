### Zonda — configuración de despliegue y cabeceras de seguridad
### Netlify. Para Cloudflare Pages usar un archivo _headers con los mismos valores.

[build]
  publish = "."

# --- redirección de HTTP a HTTPS y del dominio sin www ---
[[redirects]]
  from = "http://evolucionesec.com/*"
  to = "https://evolucionesec.com/:splat"
  status = 301
  force = true

# --- cabeceras de seguridad para todo el sitio ---
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # OJO: 'unsafe-inline' en script-src solo mientras el JS siga embebido en el HTML.
    # Al separarlo a app.js, borrar 'unsafe-inline' de script-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co https://cdnjs.cloudflare.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"

# --- el HTML no se cachea: cada recarga trae la versión vigente ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# --- los estáticos con hash sí se cachean ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
